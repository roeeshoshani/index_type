[package]
name = "index_type"
version = "0.7.0"
edition = "2024"
description = "Type-safe newtype indices for Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roeeshoshani/index_type"
keywords = ["index", "typed", "collection", "safe"]
categories = ["rust-patterns", "no-std"]

[workspace]
members = ["index_type_macros"]

[features]
default = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dependencies]
index_type_macros = { path = "index_type_macros", version = "0.7.0" }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
trybuild = "1.0"
serde_json = "1.0"
